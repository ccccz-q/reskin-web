# 旅行手稿风格模板
# 重写说明（2026-09-26）：本模板此前与第三方提示词原文高度雷同，已按"保真优先 + 减少模型自由发挥"整体重写。
# 重写遵循五条：
#   ① 保真要求前置且逐条具体 —— 先说死什么不能动，再谈画什么
#   ② 风格描述改成正向的作画动作（"先勾结构、再上色、最后补线"），不用"高级/有艺术家气质"这类抽象形容词
#   ③ 约束条数控制在 7±2 —— 过长会互相稀释权重
#   ④ 中英分离：中文写规则，英文只出现在要求模型产出的文字里
#   ⑤ 三段式分离（preserve / creative / forbid），forbid 是保真的关键 —— 没有它模型默认自由创作
id: travel_sketch
kind: template
family_id: full_restyle
name: 艺术家旅行手稿
icon: 🎨
description: 把照片变成一页坐在现场画的旅行速写手稿
preview_image: ""            # 待 D1 用测试图预生成后填入
recommended_scenes:
  - 城市街拍
  - 风景旅行照
  - 咖啡馆场景
  - 街头人物抓拍
style_tags: [手绘, 速写, 淡彩, 纸感, 旅行]

# ── 段1 保真：必须原样保留什么（越具体，保真度越高）────────────
preserve: |
  以参考图为准作画，严格遵守以下约束：
  1. 保持原图的构图、取景范围与主体位置，不移动、不放大、不缩小任何物体。
  2. 保持画面中人物、动物、车辆的数量不变；保持人物的姿态、朝向与站位关系不变。
  3. 保持地平线高度、透视关系与物体之间的遮挡关系不变。
  4. 保持原图的光线方向与明暗分布关系不变。
  5. 不增加画面中原本不存在的物体，不删除画面中原本存在的物体。
  6. 原图的色彩关系（大面积色调倾向）保持不变，只改变色彩的呈现方式与浓度。

# ── 段2 创意：加什么（用"作画动作"描述，比形容词更可控）────────
creative: |
  作画方式：
  先用铅笔轻轻勾出结构与比例，有些次要区域就此停笔，只留下几根未收完的线；
  再用水彩薄薄铺开颜色，颜色不必填满轮廓，允许边缘外溢与飞白；
  最后用钢笔在关键处补上几笔肯定的线条，强调人物姿态与建筑结构。
  人物几笔带过即可，抓住姿态与衣着的大形，不刻画五官细节。
  景物按远近处理：近处细节稍多，远处只用少量色块与线条带过。
  纸面是米白速写纸，保留纸纹、铅笔石墨颗粒、水彩干涸后的边缘与零星溅点。
  画面留出大片未落笔的空白，笔触疏密随观察深入自然变化。

  文字：底部留白处添加一行英文手写体的画面标题，标题下方是一句更小的英文手写短句。
  文字应贴近纸面质感，像是随手写在速写本上的批注，字迹自然，不要印刷体。

# ── 段3 禁止：什么绝对不能出现（本范式成败的关键）──────────────
forbid: |
  不要：
  改变构图或裁剪画面；
  增加或删除物体、改变人物数量与动作；
  把画面处理成完整上色的插画或油画，所有区域都涂满；
  光滑的数字渐变、塑料质感、3D 渲染感、照片滤镜感；
  清晰锐利的现代数字字体、印刷体的规整标题；
  商业广告风格、多余的装饰元素或边框、水印。
