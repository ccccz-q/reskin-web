kind: family
id: doodle_narrators
name: 趣味小人
icon: 🖊️
description: 原照片主体保真融入整幅画面，黑线小人物在同一画面里围绕主体展开小故事
layout: full
default_aspect: '3:4'
forbid_scope: whole
allow_change:
- color
- light
- detail_density
- background
- text_add
- figure_add
suitable:
- 生活场景照
- 街拍
- 室内空间
- 有明确主体的照片
hard_forbid:
- 多图拼贴、圆角卡片、手账贴纸
- Q版大头、儿童绘本、彩色卡通人物、3D人物
- 重复复制粘贴的相同人物
- 厚重描边、商业广告感、Logo 与大段文字
- 重绘或改变原照片核心主体的身份、结构与真实质感
params:
  figure_count:
    type: enum
    options:
    - '2'
    - '3'
    - '4'
    - '5'
    - '7'
    default: '3'
  anchor_num:
    type: number
    range:
    - 1
    - 3
    default: 2
  tone:
    type: enum
    options:
    - warm_white
    - cream
    default: warm_white
  text_lang:
    type: enum
    options:
    - en
    - zh
    default: en
dicts:
  tone:
    warm_white: 暖白色
    cream: 奶油色
  # ★ 名册：把「N 个」落成一份可点名的清单（2026-10-05 实测加的）
  #   起因：写死"恰好 N 个"后，2 个和 4 个都严格正确了，但 7 个只出了 6 个
  #   —— 数量一多，模型开始"数不过来"，光给数字它会自己漏。
  #   换成"这 7 个人分别在干什么"的清单，它就有可逐条落实的对象。
  #   每一档的动作互不重复，避免出现两个小人干同一件事（那等于少一个）。
  figure_count:
    '2': 这两个小人分别是：①站在主体旁仰头端详主体，②蹲在主体根部动手修整。
    '3': 这三个小人分别是：①站在主体左侧指指点点，②攀在主体顶部向下张望，
         ③蹲在主体基座旁清点整理。
    '4': 这四个小人分别是：①在主体顶部奔跑，②架梯子攀在主体侧面，③在主体左侧搬运，
         ④坐在主体右侧地上敲打。
    '5': 这五个小人分别是：①在主体顶部奔跑，②架梯子攀在主体侧面，③在主体左侧搬运，
         ④坐在主体基座旁敲打，⑤站在主体右侧举手指挥。
    '7': 这七个小人分别是：①在主体顶部奔跑，②架梯子攀在主体左侧面，③在主体左下搬运纸箱，
         ④在主体正左举手欢呼，⑤坐在主体基座右侧休息，⑥在主体右侧梯子顶端举手呼喊，
         ⑦站在主体最右侧展开图纸查看。
segments:
  preserve: '画幅与原图完全一致（比例不得改变，不裁切主体）。

    完整保留原图的核心主体「{subject.name}」：它的结构、材质、色彩、真实摄影质感

    与自然光影方向必须原样出现在整幅画面里，不得重绘成插画、不得卡通化、不得改变身份特征。

    原图中的真实文字与标识可以保留，不擅自添加品牌或修改文字。

    '
  creative: '整幅画面就是一张融合作品，**不是上下拼接的海报**：

    以{tone_desc}纸面为底，核心主体「{subject.name}」以真实摄影质感安置在画面中

    （取原图中最有记忆点的 {anchor_num} 个视觉锚点：{anchor_desc_short}），

    主体与纸面之间自然融合过渡——主体边缘可轻微手撕纸边或柔和晕开，不出现矩形照片框，更没有水平分界线。

    围绕主体加入**恰好 {figure_count} 个**极简黑线小人物，与主体处在**同一个空间**里

    （站在主体脚下、爬到主体上、靠着主体休息……），共同完成一段与照片主题有关的连续小故事

    （攀爬、搬运、传递、整理、观察、阅读、协作或庆祝），所有行为必须回应主体的结构与尺度。

    ★ 数量是硬要求：画完后逐个清点，画面里的小人物总数必须**严格等于 {figure_count} 个**，

    多一个或少一个都算错误。落笔前先在心里定好 {figure_count} 个不同的角色与各自的动作，

    不要画着画着多添一个，也不要为了画面热闹而加码。

    具体名册（逐条落实，一个都不能少，也不要额外添加）：{figure_count_desc}。

    小人物用细而略带手绘抖动感的黑色线条，头部为简单圆形或椭圆形，五官以小点和短线概括，

    身体小巧、动作灵活、内部大面积留白；发型、高矮、胖瘦、服装轮廓与性格姿态各不相同，

    但保持统一的线条粗细与绘画语言，像同一位插画师创作的一组固定角色。

    主体周围保留大面积干净留白，让照片元素像被安放在纸面上。

    在留白处加一句简短{text_lang_desc}手写旁白：像人物留下的纸条或画外音，轻松巧妙，

    用小号不规则的黑色手写字体沿主体轮廓或留白节奏排版，清晰准确，只有这一句。

    '
  forbid: |
    - 避免：{hard_forbid_joined}
    - {dynamic_forbid}
    - 严禁出现上下拼接的版面结构
    - 不得出现水平分界线
    - 不得出现矩形照片框
    - ★ 小人物数量必须严格等于 {figure_count} 个：多画一个、漏画一个、
      或者把其中一个画成两个（重叠、镜像、影子式的重复）都算错误
    - 不要出现人物被裁切、半藏在主体后方导致无法数清的情况
not_suitable:
- 纯风景无人无物（小人没有互动对象）
- 剧烈运动抓拍
